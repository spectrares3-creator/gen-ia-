<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titre et description : ce que Google affiche dans les resultats de recherche -->
  <title>Gen IA — Ton assistant intelligent en ligne</title>
  <meta name="description" content="Gen est une intelligence artificielle conversationnelle gratuite en ligne. Discute avec Gen en francais, pose des questions de maths, de philosophie, et bien plus.">
  <meta name="keywords" content="Gen, Gen IA, intelligence artificielle, chatbot francais, assistant IA, IA gratuite, discuter avec une IA">
  <meta name="author" content="Gen IA">
  <link rel="canonical" href="https://TON-SITE.onrender.com/">

  <!-- Open Graph : apercu quand le lien est partage (WhatsApp, Facebook, Discord...) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gen IA — Ton assistant intelligent en ligne">
  <meta property="og:description" content="Discute avec Gen, une intelligence artificielle conversationnelle en francais, gratuite et disponible en ligne.">
  <meta property="og:url" content="https://TON-SITE.onrender.com/">
  <meta property="og:locale" content="fr_FR">

  <!-- Apercu quand le lien est partage sur Twitter/X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Gen IA — Ton assistant intelligent en ligne">
  <meta name="twitter:description" content="Discute avec Gen, une intelligence artificielle conversationnelle en francais, gratuite et disponible en ligne.">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== Selecteur de couleur sur l'accueil (fixe en haut a droite) ===== */
    .home-theme-btn {
      position: fixed;
      top: 18px; right: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.06em;
      font-family: inherit;
      padding: 6px 12px 6px 8px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .home-theme-btn:hover { border-color: var(--violet-deep); color: var(--text); }
    .home-theme-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 6px var(--violet);
      flex-shrink: 0;
    }
    .home-theme-panel {
      position: fixed;
      top: 58px; right: 18px;
      z-index: 30;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      display: none;
      gap: 10px;
      box-shadow: 0 12px 40px -8px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    }
    .home-theme-panel.open { display: flex; }
    .home-theme-swatch {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18);
      cursor: pointer;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s;
    }
    .home-theme-swatch:hover { transform: scale(1.12); }
    .home-theme-swatch.selected { border-color: var(--text); }
    .home-theme-swatch .check { font-size: 13px; opacity: 0; }
    .home-theme-swatch.selected .check { opacity: 1; }

    /* ===== Sphere en fil de fer + anneaux electriques (canvas) ===== */
    .home-orb { width: 360px; height: 360px; position: relative; margin-bottom: 26px; perspective: 900px; }
    .home-orb::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, rgba(var(--accent-rgb), 0) 70%);
      animation: haloGlow 3.2s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes haloGlow {
      from { opacity: 0.6; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1.04); }
    }

    /* Canvas ou sont dessines les anneaux electriques + les particules
       (voir le script en bas de page) */
    .orb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Petite sphere filaire centrale, translucide, qui tourne tres vite sur
       un seul axe (comme un globe) - les meridiens depassent legerement
       du contour de la sphere. */
    .sphere-wrap {
      position: absolute; top: 50%; left: 50%;
      width: 90px; height: 90px;
      margin: -45px 0 0 -45px;
      z-index: 2;
      perspective: 500px;
    }
    .orb-shell {
      position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), rgba(var(--accent-rgb), 0.55) 40%, rgba(var(--accent-rgb), 0.18) 75%, rgba(var(--accent-rgb), 0.06) 100%);
      box-shadow: 0 0 40px 8px rgba(var(--accent-rgb), 0.45), inset -10px -12px 22px rgba(0,0,0,0.35), inset 8px 8px 16px rgba(255,255,255,0.15);
      border: 1px solid rgba(var(--accent-rgb), 0.5);
    }
    .orb-shell::after {
      content: ''; position: absolute; top: 14%; left: 20%; width: 30%; height: 22%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0) 70%);
      filter: blur(1px);
    }
    .orb-lines {
      position: absolute; inset: -8%; border-radius: 50%; overflow: hidden;
      transform-style: preserve-3d;
      animation: turnSlow 0.12s linear infinite;
    }
    .orb-lines .gc { position: absolute; inset: 0; border-radius: 50%; border: 0.8px solid rgba(255,255,255,0.55); }
    .orb-lines .gc1 { transform: rotateY(15deg); }
    .orb-lines .gc2 { transform: rotateY(75deg); }
    .orb-lines .gc3 { transform: rotateY(135deg); }
    .orb-lines .gc4 { transform: rotateX(80deg); }
    @keyframes turnSlow {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    /* ===== Indice secret qui apparait de temps en temps, a une position   */
    /* aleatoire (calculee en JS) tout autour de la sphere.                 */
    .secret-hint {
      position: absolute;
      top: 50%; left: 50%;
      --hint-scale: 0.85;
      background: var(--surface);
      border: 1px solid var(--violet-deep);
      color: var(--violet-pale);
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.03em;
      padding: 5px 10px;
      border-radius: 100px;
      cursor: default;
      opacity: 0;
      transform: translate(-50%, -50%) scale(var(--hint-scale));
      pointer-events: none;
      transition: opacity 0.4s, transform 0.4s;
      box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.35);
      z-index: 5;
      white-space: nowrap;
    }
    .secret-hint.show { opacity: 1; --hint-scale: 1; pointer-events: auto; }
    .secret-hint-tooltip {
      position: absolute;
      top: 130%; left: 50%;
      transform: translateX(-50%) translateY(-4px);
      width: 190px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      font-family: inherit;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
      white-space: normal;
    }
    .secret-hint:hover .secret-hint-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="home">

  <button class="home-theme-btn" id="homeThemeBtn" title="Couleur">
    <span class="home-theme-dot" id="homeThemeDot"></span>Couleur
  </button>
  <div class="home-theme-panel" id="homeThemePanel"></div>

  <main class="home-container">

    <div class="home-orb">
      <canvas class="orb-canvas" id="orbCanvas"></canvas>

      <div class="sphere-wrap">
        <div class="orb-shell"></div>
        <div class="orb-lines">
          <div class="gc gc1"></div>
          <div class="gc gc2"></div>
          <div class="gc gc3"></div>
          <div class="gc gc4"></div>
        </div>
      </div>

      <div class="secret-hint" id="secretHint">
        <span id="secretHintText">/game</span>
        <div class="secret-hint-tooltip" id="secretHintTooltip">Lance un mini-jeu de tir d'astéroïdes dans le chat</div>
      </div>
    </div>

    <h1>Gen IA</h1>

    <p>
      Ton assistant intelligent toujours prêt à discuter avec toi.
    </p>

    <a href="chat.html" class="start-btn">
      Parler à mon IA
    </a>

    <a href="signup.html" class="signup-btn">
      Créer un compte
    </a>
  </main>

<script>
(function() {
  const THEMES = {
    violet: { label: 'Violet', swatch: '#b45cff', checkColor: '#000',
      bg: '#07030d', bgGlow: '#1a0d2c', surface: '#0f0817', surface2: '#150c22', border: '#2a1a3d',
      accent: '#b45cff', accentDeep: '#7a2cff', accentPale: '#d7a6ff', accentRgb: '180, 92, 255',
      coreLight: '#f0d9ff', coreDark: '#4d0b7a', userBubble: '#29103c', text: '#efe5f5', textDim: '#8e7a9f' },
    vert: { label: 'Vert', swatch: '#22c55e', checkColor: '#000',
      bg: '#040d06', bgGlow: '#0e2414', surface: '#0a170c', surface2: '#0f1f12', border: '#1d3322',
      accent: '#4ade80', accentDeep: '#16a34a', accentPale: '#bbf7d0', accentRgb: '74, 222, 128',
      coreLight: '#e3fce9', coreDark: '#0b4023', userBubble: '#123320', text: '#e9f7ec', textDim: '#7fa98c' },
    noir: { label: 'Noir', swatch: '#000000', checkColor: '#fff',
      bg: '#000000', bgGlow: '#161616', surface: '#0d0d0d', surface2: '#171717', border: '#2c2c2c',
      accent: '#e5e5e5', accentDeep: '#9a9a9a', accentPale: '#ffffff', accentRgb: '229, 229, 229',
      coreLight: '#ffffff', coreDark: '#1a1a1a', userBubble: '#1f1f1f', text: '#f2f2f2', textDim: '#8a8a8a' },
    gris: { label: 'Gris', swatch: '#a1a1aa', checkColor: '#000',
      bg: '#0c0c0e', bgGlow: '#1f1f24', surface: '#161619', surface2: '#1e1e22', border: '#333338',
      accent: '#a1a1aa', accentDeep: '#71717a', accentPale: '#d4d4d8', accentRgb: '161, 161, 170',
      coreLight: '#e4e4e7', coreDark: '#3f3f46', userBubble: '#26262b', text: '#eaeaec', textDim: '#8b8b91' },
    rouge: { label: 'Rouge', swatch: '#ef4444', checkColor: '#fff',
      bg: '#0d0304', bgGlow: '#2b0d0f', surface: '#170809', surface2: '#210c0e', border: '#3d1a1c',
      accent: '#ff5c5c', accentDeep: '#dc2626', accentPale: '#ffb3b3', accentRgb: '255, 92, 92',
      coreLight: '#ffd9d9', coreDark: '#5c0d0d', userBubble: '#3d1216', text: '#f7e8e8', textDim: '#a97f7f' },
    blanc: { label: 'Blanc', swatch: '#ffffff', checkColor: '#000',
      bg: '#f4f3f6', bgGlow: '#ffffff', surface: '#ffffff', surface2: '#ece8f2', border: '#ddd6e3',
      accent: '#111111', accentDeep: '#000000', accentPale: '#2b2b2b', accentRgb: '17, 17, 17',
      coreLight: '#5a5a5a', coreDark: '#000000', userBubble: '#e6e2ee', text: '#1a1a1a', textDim: '#8f849e' }
  };
  const SECRET_THEMES = {
    golden: { label: 'Golden', swatch: '#e5b93a',
      bg: '#0c0701', bgGlow: '#2a1c05', surface: '#171006', surface2: '#221808', border: '#4a3410',
      accent: '#e5b93a', accentDeep: '#b8860b', accentPale: '#ffe38a', accentRgb: '229, 185, 58',
      coreLight: '#fff3c4', coreDark: '#5c4308', userBubble: '#332309', text: '#faf1d9', textDim: '#a68f5c' }
  };

  const root = document.documentElement;
  const themeBtn = document.getElementById('homeThemeBtn');
  const themePanel = document.getElementById('homeThemePanel');
  const themeDot = document.getElementById('homeThemeDot');
  let currentTheme = localStorage.getItem('genTheme') || 'violet';

  function applyTheme(name, persist) {
    const t = THEMES[name] || SECRET_THEMES[name];
    if (!t) return;
    currentTheme = name;
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--bg-glow', t.bgGlow);
    root.style.setProperty('--surface', t.surface);
    root.style.setProperty('--surface-2', t.surface2);
    root.style.setProperty('--border', t.border);
    root.style.setProperty('--violet', t.accent);
    root.style.setProperty('--violet-deep', t.accentDeep);
    root.style.setProperty('--violet-pale', t.accentPale);
    root.style.setProperty('--accent-rgb', t.accentRgb);
    root.style.setProperty('--core-light', t.coreLight);
    root.style.setProperty('--core-dark', t.coreDark);
    root.style.setProperty('--user-bubble', t.userBubble);
    root.style.setProperty('--text', t.text);
    root.style.setProperty('--text-dim', t.textDim);
    themeDot.style.background = t.accent;
    themeDot.style.boxShadow = `0 0 6px ${t.accent}`;
    themePanel.querySelectorAll('.home-theme-swatch').forEach(sw => {
      sw.classList.toggle('selected', sw.dataset.theme === name);
    });
    if (persist !== false) { try { localStorage.setItem('genTheme', name); } catch (e) {} }
  }

  themePanel.innerHTML = Object.entries(THEMES).map(([key, t]) => `
    <button class="home-theme-swatch${key === currentTheme ? ' selected' : ''}" data-theme="${key}" title="${t.label}" style="background:${t.swatch};">
      <span class="check" style="color:${t.checkColor}">✓</span>
    </button>
  `).join('');
  themePanel.querySelectorAll('.home-theme-swatch').forEach(sw => {
    sw.addEventListener('click', () => { applyTheme(sw.dataset.theme); themePanel.classList.remove('open'); });
  });
  applyTheme(currentTheme, false);

  themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    themePanel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!themePanel.contains(e.target) && !themeBtn.contains(e.target)) themePanel.classList.remove('open');
  });

  // ===== Indice secret qui apparait de temps en temps =====
  const HINTS = [
    { cmd: '/game', desc: "Lance un mini-jeu de tir d'astéroïdes dans le chat" },
    { cmd: '/hack', desc: "Réinitialise la conversation actuelle avec un effet glitch" },
    { cmd: '/golden', desc: "Débloque un thème doré secret" },
    { cmd: '/reset', desc: "Retire le thème doré et revient au violet" }
  ];
  const hintEl = document.getElementById('secretHint');
  const hintTextEl = document.getElementById('secretHintText');
  const hintTooltipEl = document.getElementById('secretHintTooltip');
  let hintHovered = false;

  hintEl.addEventListener('mouseenter', () => { hintHovered = true; });
  hintEl.addEventListener('mouseleave', () => { hintHovered = false; });

  function showRandomHint() {
    const h = HINTS[Math.floor(Math.random() * HINTS.length)];
    hintTextEl.textContent = h.cmd;
    hintTooltipEl.textContent = h.desc;

    // Position aleatoire tout autour de la sphere (rayon fixe depuis le centre)
    const angle = Math.random() * Math.PI * 2;
    const radius = 188; // depasse legerement le dernier anneau (rayon ~180px sur 360px)
    const cx = 180, cy = 180; // centre de la sphere (home-orb fait 360x360)
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    hintEl.style.left = x + 'px';
    hintEl.style.top = y + 'px';

    hintEl.classList.add('show');
    setTimeout(() => {
      if (!hintHovered) hintEl.classList.remove('show');
      else {
        const check = setInterval(() => {
          if (!hintHovered) { hintEl.classList.remove('show'); clearInterval(check); }
        }, 500);
      }
    }, 4000);
  }
  setInterval(showRandomHint, 9000);
  setTimeout(showRandomHint, 2500);

  // ===== Anneaux electriques + particules autour de la sphere =====
  const orbCanvas = document.getElementById('orbCanvas');
  const octx = orbCanvas.getContext('2d');
  const ORB_SIZE = 360;
  const DPR = window.devicePixelRatio || 1;
  orbCanvas.width = ORB_SIZE * DPR;
  orbCanvas.height = ORB_SIZE * DPR;
  orbCanvas.style.width = ORB_SIZE + 'px';
  orbCanvas.style.height = ORB_SIZE + 'px';
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const OCX = ORB_SIZE / 2, OCY = ORB_SIZE / 2;

  function getAccentRgb() {
    return getComputedStyle(root).getPropertyValue('--accent-rgb').trim() || '180, 92, 255';
  }

  // Petites branches courtes utilisees pour les etincelles qui sautent
  // depuis un anneau de temps en temps.
  function buildSpark(x, y, angle, len, depth, list) {
    const a = angle + (Math.random() - 0.5) * 0.9;
    const x2 = x + Math.cos(a) * len;
    const y2 = y + Math.sin(a) * len;
    list.push({ x1: x, y1: y, x2, y2 });
    if (depth > 0 && len > 4) {
      const children = Math.random() < 0.75 ? 2 : 1;
      for (let i = 0; i < children; i++) {
        buildSpark(x2, y2, a + (Math.random() - 0.5) * 1.6, len * (0.55 + Math.random() * 0.2), depth - 1, list);
      }
    }
  }

  // Projection d'un anneau (cercle) incline en 3D (tx, ty) et qui tourne
  // sur lui-meme (spin), sans vraie perspective (approximation orthographique
  // suffisante a cette echelle).
  function ringPoint(R, tx, ty, spin, theta) {
    const x0 = R * Math.cos(theta + spin);
    const y0 = R * Math.sin(theta + spin);
    const y1 = y0 * Math.cos(tx);
    const z1 = y0 * Math.sin(tx);
    const x2 = x0 * Math.cos(ty) + z1 * Math.sin(ty);
    return { x: x2, y: y1 };
  }

  const RINGS = [
    { R: 86,  tx: 80 * Math.PI / 180, ty: 0,                 speed: 2 * Math.PI / (9 * 60),  dir: 1  },
    { R: 112, tx: 20 * Math.PI / 180, ty: 70 * Math.PI / 180, speed: 2 * Math.PI / (14 * 60), dir: -1 },
    { R: 138, tx: 45 * Math.PI / 180, ty: 40 * Math.PI / 180, speed: 2 * Math.PI / (19 * 60), dir: 1  },
    { R: 159, tx: -55 * Math.PI / 180, ty: -20 * Math.PI / 180, speed: 2 * Math.PI / (12 * 60), dir: -1 },
    { R: 142, tx: 8 * Math.PI / 180, ty: -55 * Math.PI / 180, speed: 2 * Math.PI / (23 * 60), dir: 1  },
    { R: 170, tx: 65 * Math.PI / 180, ty: 15 * Math.PI / 180, speed: 2 * Math.PI / (17 * 60), dir: -1 }
  ];
  RINGS.forEach((r) => { r.spin = Math.random() * Math.PI * 2; });

  function drawElectricRing(ring, rgb) {
    const STEPS = 100;
    const pts = [];
    for (let i = 0; i <= STEPS; i++) {
      const theta = (i / STEPS) * Math.PI * 2;
      const jitterR = ring.R + (Math.random() - 0.5) * 3;
      const p = ringPoint(jitterR, ring.tx, ring.ty, ring.spin, theta);
      pts.push({ x: OCX + p.x, y: OCY + p.y });
    }
    octx.beginPath();
    pts.forEach((p, i) => { if (i === 0) octx.moveTo(p.x, p.y); else octx.lineTo(p.x, p.y); });
    octx.closePath();
    octx.strokeStyle = `rgba(${rgb}, 0.45)`;
    octx.lineWidth = 0.9;
    octx.shadowColor = `rgba(${rgb}, 0.45)`;
    octx.shadowBlur = 6;
    octx.stroke();
    return pts;
  }

  let ringSparks = [];
  function maybeSpawnRingSpark(pts) {
    if (Math.random() < 0.015 && pts.length) {
      const p = pts[Math.floor(Math.random() * pts.length)];
      const angle = Math.atan2(p.y - OCY, p.x - OCX);
      const list = [];
      buildSpark(p.x, p.y, angle, 7 + Math.random() * 5, 2, list);
      ringSparks.push({ segs: list, life: 0, maxLife: 14 });
    }
  }

  let particles = [];
  function spawnParticle() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 1.1;
    particles.push({
      x: OCX, y: OCY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: 55 + Math.random() * 55,
      size: 1 + Math.random() * 2.4
    });
  }

  function tickOrb() {
    octx.clearRect(0, 0, ORB_SIZE, ORB_SIZE);
    const rgb = getAccentRgb();

    RINGS.forEach((ring) => {
      ring.spin += ring.speed * ring.dir;
      const pts = drawElectricRing(ring, rgb);
      maybeSpawnRingSpark(pts);
    });
    octx.shadowBlur = 0;

    ringSparks.forEach((s) => {
      s.life++;
      const alpha = Math.max(0, 1 - s.life / s.maxLife);
      s.segs.forEach((b) => {
        octx.beginPath();
        octx.moveTo(b.x1, b.y1);
        octx.lineTo(b.x2, b.y2);
        octx.strokeStyle = `rgba(255,255,255,${alpha})`;
        octx.shadowColor = `rgba(${rgb}, 0.9)`;
        octx.shadowBlur = 6;
        octx.lineWidth = 1;
        octx.stroke();
      });
    });
    ringSparks = ringSparks.filter((s) => s.life < s.maxLife);
    octx.shadowBlur = 0;

    if (particles.length < 70 && Math.random() < 0.6) spawnParticle();
    particles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life++;
      const t = p.life / p.maxLife;
      const alpha = Math.max(0, 1 - t);
      octx.beginPath();
      octx.fillStyle = `rgba(${rgb}, ${alpha})`;
      octx.shadowColor = `rgba(${rgb}, ${alpha})`;
      octx.shadowBlur = 6;
      octx.arc(p.x, p.y, p.size * (1 - t * 0.5), 0, Math.PI * 2);
      octx.fill();
    });
    particles = particles.filter((p) => p.life < p.maxLife);

    requestAnimationFrame(tickOrb);
  }
  tickOrb();
})();
</script>

</body>
</html>
