<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen IA - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-app">

    <header>
      <a href="index.html" class="back">←</a>

      <div class="header-titles">
        <h2>Gen IA</h2>
        <span>En ligne</span>
      </div>

      <div class="header-actions">
        <button class="theme-btn" id="themeBtn" title="Couleur">
          <span class="theme-dot" id="themeDot"></span>
        </button>
        <button class="menu-btn" id="menuBtn" title="Options">☰</button>
      </div>

      <div class="theme-panel" id="themePanel"></div>

      <div class="menu-panel" id="menuPanel">
        <div class="menu-label">Mode</div>
        <button class="menu-item active" id="modeDefault">
          <span class="menu-icon">💬</span> Normal <span class="menu-check">✓</span>
        </button>
        <button class="menu-item" id="modeMath">
          <span class="menu-icon">∑</span> Maths <span class="menu-check">✓</span>
        </button>
        <button class="menu-item" id="modePhilo">
          <span class="menu-icon">∞</span> Philosophie <span class="menu-check">✓</span>
        </button>
        <div class="menu-divider"></div>
        <div class="menu-label">Outils</div>
        <button class="menu-item" id="btnDictate">
          <span class="menu-icon">🎙</span> Dicter un message
        </button>
        <button class="menu-item active" id="btnSpeak">
          <span class="menu-icon">🔊</span><span class="menu-text"> Lire les réponses</span> <span class="menu-check">✓</span>
        </button>
        <button class="menu-item" id="btnImage">
          <span class="menu-icon">✦</span> Générer une image
        </button>
        <div class="menu-divider"></div>
        <div class="menu-label">Conversations</div>
        <button class="menu-item" id="newConvBtn">
          <span class="menu-icon">＋</span> Nouvelle conversation
        </button>
        <div class="history-list" id="historyList"></div>
        <div class="menu-divider hidden-controls" id="spectraDivider"></div>
        <button class="menu-item hidden-controls" id="btnExitSpectra">
          <span class="menu-icon">🚪</span> Quitter le mode Spectra
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" id="btnLogout">
          <span class="menu-icon">🔒</span> Se déconnecter
        </button>
      </div>
    </header>

    <div class="login-overlay" id="loginOverlay">
      <form class="login-box" id="loginForm">
        <h2>Connexion à Gen</h2>
        <input type="text" id="loginUsername" placeholder="Identifiant" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required>
        <button type="submit">Se connecter</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>

    <main id="messages" class="messages"></main>

    <form class="input-area" id="chatForm">
      <textarea
        id="userInput"
        placeholder="Écris ton message..."
        autocomplete="off"
        rows="1"
      ></textarea>
      <button type="button" class="mic-btn" id="micBtn" title="Dicter un message">🎙</button>
      <button type="submit">➤</button>
    </form>

  </div>

  <!-- Mini-jeu /game -->
  <div class="game-overlay" id="gameOverlay">
    <div class="game-topbar">
      <div class="game-score" id="gameScore">SCORE 0</div>
      <div class="game-lives" id="gameLives"></div>
      <button class="game-admin-btn hidden-controls" id="gameAdminBtn" title="Pouvoirs Spectra">🛠</button>
      <button class="game-close" id="gameClose" title="Retour au chat">✕</button>
    </div>
    <canvas class="game-canvas" id="gameCanvas" width="330" height="420"></canvas>
    <div class="game-hint" id="gameHint">Glisse ou touche pour te déplacer • tir automatique</div>

    <div class="game-controls" id="controlsAsteroids">
      <button class="game-btn" id="gameLeft">◀</button>
      <button class="game-btn" id="gameRight">▶</button>
    </div>

    <div class="game-controls game-dpad" id="controlsSnake">
      <div class="dpad-row">
        <button class="game-btn" id="snakeUp">▲</button>
      </div>
      <div class="dpad-row">
        <button class="game-btn" id="snakeLeft">◀</button>
        <button class="game-btn" id="snakeDown">▼</button>
        <button class="game-btn" id="snakeRight">▶</button>
      </div>
    </div>

    <div class="game-upgrade" id="gameAdminPanel">
      <div class="game-upgrade-title">Pouvoirs Spectra</div>
      <div class="game-upgrade-sub">Accès exclusif</div>
      <div class="game-upgrade-cards" id="gameAdminCards"></div>
      <button class="game-over-btn" id="gameAdminClose">Fermer</button>
    </div>

    <div class="game-select" id="gameSelect">
      <div class="game-upgrade-title">Choisis un jeu</div>
      <div class="game-upgrade-cards">
        <button class="upgrade-card" id="selectAsteroids">
          <span class="upgrade-icon">☄️</span>
          <span><div class="upgrade-label">Astéroïdes</div><div class="upgrade-desc">Tir à l'infini, vies et améliorations</div></span>
        </button>
        <button class="upgrade-card" id="selectSnake">
          <span class="upgrade-icon">🐍</span>
          <span><div class="upgrade-label">Snake</div><div class="upgrade-desc">Le classique du serpent qui grandit</div></span>
        </button>
      </div>
    </div>

    <div class="game-pause" id="gamePause">
      <div class="game-over-title">⏸ Pause</div>
      <div class="game-over-score">Appuie sur Espace pour reprendre</div>
    </div>

    <div class="game-over" id="gameOver">
      <div class="game-over-title" id="gameOverTitle">Vaisseau détruit</div>
      <div class="game-over-score" id="gameOverScore">Score : 0</div>
      <div class="game-over-actions">
        <button class="game-over-btn" id="gameQuit">Retour au chat</button>
        <button class="game-over-btn primary" id="gameRetry">Rejouer</button>
      </div>
    </div>
    <div class="game-upgrade" id="gameUpgrade">
      <div class="game-upgrade-title">Palier atteint !</div>
      <div class="game-upgrade-sub">Choisis une amélioration</div>
      <div class="game-upgrade-cards" id="gameUpgradeCards"></div>
    </div>
  </div>

<script>
(function() {
  const API_URL = "/api/chat";

  const THEMES = {
    violet: { label: 'Violet', swatch: '#b45cff', checkColor: '#000',
      bg: '#07030d', bgGlow: '#1a0d2c', surface: '#0f0817', surface2: '#150c22', border: '#2a1a3d',
      accent: '#b45cff', accentDeep: '#7a2cff', accentPale: '#d7a6ff', accentRgb: '180, 92, 255',
      coreLight: '#f0d9ff', coreDark: '#4d0b7a', userBubble: '#29103c', text: '#efe5f5', textDim: '#8e7a9f' },
    vert: { label: 'Vert', swatch: '#22c55e', checkColor: '#000',
      bg: '#040d06', bgGlow: '#0e2414', surface: '#0a170c', surface2: '#0f1f12', border: '#1d3322',
      accent: '#4ade80', accentDeep: '#16a34a', accentPale: '#bbf7d0', accentRgb: '74, 222, 128',
      coreLight: '#e3fce9', coreDark: '#0b4023', userBubble: '#123320', text: '#e9f7ec', textDim: '#7fa98c' },
    noir: { label: 'Noir', swatch: '#000000', checkColor: '#fff',
      bg: '#000000', bgGlow: '#161616', surface: '#0d0d0d', surface2: '#171717', border: '#2c2c2c',
      accent: '#e5e5e5', accentDeep: '#9a9a9a', accentPale: '#ffffff', accentRgb: '229, 229, 229',
      coreLight: '#ffffff', coreDark: '#1a1a1a', userBubble: '#1f1f1f', text: '#f2f2f2', textDim: '#8a8a8a' },
    gris: { label: 'Gris', swatch: '#a1a1aa', checkColor: '#000',
      bg: '#0c0c0e', bgGlow: '#1f1f24', surface: '#161619', surface2: '#1e1e22', border: '#333338',
      accent: '#a1a1aa', accentDeep: '#71717a', accentPale: '#d4d4d8', accentRgb: '161, 161, 170',
      coreLight: '#e4e4e7', coreDark: '#3f3f46', userBubble: '#26262b', text: '#eaeaec', textDim: '#8b8b91' },
    rouge: { label: 'Rouge', swatch: '#ef4444', checkColor: '#fff',
      bg: '#0d0304', bgGlow: '#2b0d0f', surface: '#170809', surface2: '#210c0e', border: '#3d1a1c',
      accent: '#ff5c5c', accentDeep: '#dc2626', accentPale: '#ffb3b3', accentRgb: '255, 92, 92',
      coreLight: '#ffd9d9', coreDark: '#5c0d0d', userBubble: '#3d1216', text: '#f7e8e8', textDim: '#a97f7f' },
    blanc: { label: 'Blanc', swatch: '#ffffff', checkColor: '#000',
      bg: '#f4f3f6', bgGlow: '#ffffff', surface: '#ffffff', surface2: '#ece8f2', border: '#ddd6e3',
      accent: '#111111', accentDeep: '#000000', accentPale: '#2b2b2b', accentRgb: '17, 17, 17',
      coreLight: '#5a5a5a', coreDark: '#000000', userBubble: '#e6e2ee', text: '#1a1a1a', textDim: '#8f849e' }
  };

  // Theme secret, debloque uniquement via la commande /golden (pas affiche
  // dans le selecteur de couleur normal).
  const SECRET_THEMES = {
    golden: { label: 'Golden', swatch: '#e5b93a',
      bg: '#0c0701', bgGlow: '#2a1c05', surface: '#171006', surface2: '#221808', border: '#4a3410',
      accent: '#e5b93a', accentDeep: '#b8860b', accentPale: '#ffe38a', accentRgb: '229, 185, 58',
      coreLight: '#fff3c4', coreDark: '#5c4308', userBubble: '#332309', text: '#faf1d9', textDim: '#a68f5c' },
    spectra: { label: 'Spectra', swatch: '#7ee8ff',
      bg: '#020409', bgGlow: '#0a1a2e', surface: '#050c16', surface2: '#0a1520', border: '#1c3550',
      accent: '#7ee8ff', accentDeep: '#3fa9dc', accentPale: '#cdf6ff', accentRgb: '126, 232, 255',
      coreLight: '#ffffff', coreDark: '#0d2a44', userBubble: '#0f2438', text: '#eaf8ff', textDim: '#6f95ab' }
  };

  const root = document.documentElement;
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const themeBtn = document.getElementById('themeBtn');
  const themePanel = document.getElementById('themePanel');
  const themeDot = document.getElementById('themeDot');
  const modeDefault = document.getElementById('modeDefault');
  const modeMath = document.getElementById('modeMath');
  const modePhilo = document.getElementById('modePhilo');
  const btnDictate = document.getElementById('btnDictate');
  const micBtn = document.getElementById('micBtn');
  const btnSpeak = document.getElementById('btnSpeak');
  const btnImage = document.getElementById('btnImage');
  const newConvBtn = document.getElementById('newConvBtn');
  const btnExitSpectra = document.getElementById('btnExitSpectra');
  const btnLogout = document.getElementById('btnLogout');
  const spectraDivider = document.getElementById('spectraDivider');
  const historyList = document.getElementById('historyList');

  let mode = 'default';
  let speaking = false;
  let spectraUnlocked = false;
  let thinking = false;
  let speakEnabled = true;
  let currentTheme = localStorage.getItem('genTheme') || 'violet';

  const GREETING = { text: "Salut 👋 Je suis Gen ! Comment puis-je t'aider ?", user: false };
  let messages = loadJSON('genActiveConversation', [GREETING]);
  let conversations = loadJSON('genConversations', []);

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function saveActive() {
    try { localStorage.setItem('genActiveConversation', JSON.stringify(messages)); } catch (e) {}
  }
  function saveConversations() {
    try { localStorage.setItem('genConversations', JSON.stringify(conversations)); } catch (e) {}
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMessages() {
    messagesEl.innerHTML = messages.map(m => `
      <div class="message ${m.user ? 'user' : 'ai'}">${escapeHtml(m.text)}</div>
    `).join('') + ((thinking || speaking) ? `
      <div class="typing"><div class="typing-cluster">
        <div class="typing-ring layer1"></div>
        <div class="typing-ring layer2"></div>
        <div class="typing-ring layer3"></div>
        <div class="typing-orb-spin">
          <div class="orb-shell"></div>
          <div class="orb-lines">
            <div class="gc gc1"></div>
            <div class="gc gc2"></div>
            <div class="gc gc3"></div>
            <div class="gc gc4"></div>
          </div>
        </div>
      </div></div>
    ` : '');
    messagesEl.scrollTop = messagesEl.scrollHeight;
    saveActive();
  }

  // ===== Connexion (compte perso) =====
  const loginOverlay = document.getElementById('loginOverlay');
  const loginForm = document.getElementById('loginForm');
  const loginUsername = document.getElementById('loginUsername');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');

  function getToken() {
    return localStorage.getItem('genToken') || '';
  }
  function setToken(token) {
    localStorage.setItem('genToken', token);
  }
  function clearToken() {
    localStorage.removeItem('genToken');
  }
  function showLogin() {
    loginOverlay.classList.add('open');
  }
  function hideLogin() {
    loginOverlay.classList.remove('open');
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: loginUsername.value.trim(), password: loginPassword.value })
      });
      const data = await response.json();
      if (!response.ok) {
        loginError.textContent = data.error || "Connexion impossible";
        return;
      }
      setToken(data.token);
      loginPassword.value = '';
      hideLogin();
    } catch (err) {
      loginError.textContent = "Impossible de joindre le serveur.";
    }
  });

  if (!getToken()) showLogin();

  function speak(text) {
    if (!speakEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    utter.onstart = () => { speaking = true; renderMessages(); };
    utter.onend = () => { speaking = false; renderMessages(); };
    utter.onerror = () => { speaking = false; renderMessages(); };
    window.speechSynthesis.speak(utter);
  }

  async function sendToGen(text) {
    const cmd = text.trim().toLowerCase();
    if (cmd === '/hack') { triggerGlitch(resetConversation); return; }
    if (cmd === '/game') { triggerGlitch(openGameMenu); return; }
    if (cmd === '/golden') { triggerGlitch(() => applyTheme('golden')); return; }
    if (cmd === '/reset') { triggerGlitch(() => applyTheme('violet')); return; }
    if (cmd === '/spectra') {
      const code = window.prompt("Code d'accès Spectra :");
      if (code === '2012!') {
        spectraUnlocked = true;
        updateSpectraMenuVisibility();
        triggerGlitch(() => {
          applyTheme('spectra');
          messages.push({ text: "Accès Spectra confirmé. Bienvenue.", user: false });
          renderMessages();
        });
      } else {
        messages.push({ text: "Code incorrect.", user: false });
        renderMessages();
      }
      return;
    }
    if (cmd === '/logs' && spectraUnlocked) {
      const logText = [
        "=== LOGS SPECTRA ===",
        "Heure : " + new Date().toLocaleString('fr-FR'),
        "Thème actif : " + currentTheme,
        "Mode : " + mode,
        "Messages (conversation actuelle) : " + messages.length,
        "Conversations archivées : " + conversations.length,
        "Voix activée : " + (speakEnabled ? "oui" : "non"),
        "Navigateur : " + navigator.userAgent,
        "",
        "(Ceci reflète l'état local de ton navigateur, pas les vrais logs du serveur.)"
      ].join('\n');
      messages.push({ text: logText, user: false });
      renderMessages();
      return;
    }

    messages.push({ text, user: true });
    thinking = true;
    renderMessages();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
        body: JSON.stringify({ messages: messages.slice(-20), mode })
      });
      if (response.status === 401) {
        clearToken();
        showLogin();
        throw new Error("Session expirée, reconnecte-toi.");
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Erreur serveur");
      thinking = false;
      messages.push({ text: data.reply, user: false });
      renderMessages();
      speak(data.reply);
    } catch (err) {
      thinking = false;
      messages.push({ text: "Je n'arrive pas à joindre mon cerveau IA (" + err.message + ")", user: false });
      renderMessages();
    }
  }

  function resetConversation() {
    messages = [GREETING];
    thinking = false;
    renderMessages();
  }

  function triggerGlitch(callback) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.body.classList.add('glitching');
    setTimeout(() => {
      document.body.classList.remove('glitching');
      callback();
    }, 450);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text && !thinking) {
      input.value = '';
      input.style.height = 'auto';
      sendToGen(text);
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ===== Menu =====
  function closeMenu() { menuPanel.classList.remove('open'); menuBtn.classList.remove('open'); }
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeThemePanel();
    menuPanel.classList.toggle('open');
    menuBtn.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!menuPanel.contains(e.target) && e.target !== menuBtn) closeMenu();
    if (!themePanel.contains(e.target) && !themeBtn.contains(e.target)) closeThemePanel();
  });

  function setMode(newMode) {
    mode = newMode;
    modeDefault.classList.toggle('active', mode === 'default');
    modeMath.classList.toggle('active', mode === 'math');
    modePhilo.classList.toggle('active', mode === 'philosophy');
    closeMenu();
  }
  modeDefault.addEventListener('click', () => setMode('default'));
  modeMath.addEventListener('click', () => setMode('math'));
  modePhilo.addEventListener('click', () => setMode('philosophy'));

  btnSpeak.addEventListener('click', () => {
    speakEnabled = !speakEnabled;
    btnSpeak.classList.toggle('active', speakEnabled);
    btnSpeak.querySelector('.menu-icon').textContent = speakEnabled ? '🔊' : '🔇';
    btnSpeak.querySelector('.menu-text').textContent = speakEnabled ? ' Lire les réponses' : ' Réponses silencieuses';
    if (!speakEnabled && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      speaking = false;
      renderMessages();
    }
    closeMenu();
  });

  btnImage.addEventListener('click', () => {
    closeMenu();
    messages.push({ text: "La génération d'images n'est pas encore branchée — ce sera une prochaine étape.", user: false });
    renderMessages();
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.interimResults = false;
    let listening = false;

    function startDictation() {
      if (listening) return;
      closeMenu();
      input.placeholder = '🎙 Je t\'écoute…';
      recognition.start();
    }
    btnDictate.addEventListener('click', startDictation);
    micBtn.addEventListener('click', startDictation);

    recognition.onstart = () => { listening = true; micBtn.classList.add('listening'); };
    recognition.onresult = (e) => {
      input.value = e.results[0][0].transcript;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      input.placeholder = 'Écris ton message...';
    };
    recognition.onerror = (e) => {
      listening = false;
      micBtn.classList.remove('listening');
      input.placeholder = 'Écris ton message...';
      const reasons = {
        'not-allowed': "Accès au micro refusé — vérifie les permissions du site.",
        'no-speech': "Je n'ai rien entendu, réessaie.",
        'audio-capture': "Aucun micro détecté sur cet appareil.",
        'network': "Problème réseau pendant la reconnaissance vocale.",
      };
      messages.push({ text: reasons[e.error] || ("Erreur de dictée vocale : " + e.error), user: false });
      renderMessages();
    };
  } else {
    function unsupportedDictation() {
      closeMenu();
      messages.push({ text: "Ton navigateur ne supporte pas la reconnaissance vocale (essaie sur Chrome).", user: false });
      renderMessages();
    }
    btnDictate.addEventListener('click', unsupportedDictation);
    micBtn.addEventListener('click', unsupportedDictation);
  }

  // ===== Conversations (localStorage) =====
  function archiveCurrentConversation() {
    const hasUserMsg = messages.some(m => m.user);
    if (!hasUserMsg) return;
    const firstUserMsg = messages.find(m => m.user);
    const label = firstUserMsg.text.length > 32 ? firstUserMsg.text.slice(0, 32) + '…' : firstUserMsg.text;
    conversations.unshift({
      id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
      label, messages: JSON.parse(JSON.stringify(messages))
    });
    saveConversations();
  }
  function startNewConversation() {
    archiveCurrentConversation();
    messages = [GREETING];
    renderMessages();
    renderHistoryMenu();
    closeMenu();
  }
  function openConversation(id) {
    const idx = conversations.findIndex(c => c.id === id);
    if (idx === -1) return;
    archiveCurrentConversation();
    messages = conversations[idx].messages;
    conversations.splice(idx, 1);
    saveConversations();
    renderMessages();
    renderHistoryMenu();
    closeMenu();
  }
  function deleteConversation(id, e) {
    e.stopPropagation();
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    renderHistoryMenu();
  }
  function renderHistoryMenu() {
    if (!conversations.length) {
      historyList.innerHTML = '<div class="menu-empty">Aucune conversation archivée</div>';
      return;
    }
    historyList.innerHTML = conversations.map(c => `
      <button class="menu-item history-item" data-id="${c.id}">
        <span class="menu-icon">💬</span>
        <span class="menu-text-trunc">${escapeHtml(c.label)}</span>
        <span class="history-del" data-del="${c.id}" title="Supprimer">✕</span>
      </button>
    `).join('');
    historyList.querySelectorAll('.history-item').forEach(btn => {
      btn.addEventListener('click', () => openConversation(btn.dataset.id));
    });
    historyList.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', (e) => deleteConversation(el.dataset.del, e));
    });
  }
  newConvBtn.addEventListener('click', startNewConversation);
  btnLogout.addEventListener('click', () => {
    closeMenu();

  function updateLivesUI() {

  function resetAsteroidsState() {

    bullets = []; asteroids = []; score = 0; spawnTimer = 0; elapsed = 0; moveDir = 0; lastUpgradeScore = 0;

  function startAsteroids() {
    currentGame = 'asteroids';
    gamePaused = false;
    resetAsteroidsState();
    controlsAsteroidsEl.classList.remove('hidden-controls');

    gameHintEl.textContent = 'Glisse ou touche pour te déplacer • tir automatique';
    gameRunning = true;
    window.addEventListener('keydown', onGameKeyDown);

  }
  function closeGame() {
    gameRunning = false;
    gamePaused = false;
    document.getElementById('gamePause').classList.remove('open');
    if (gameRAF) cancelAnimationFrame(gameRAF);
    window.removeEventListener('keydown', onGameKeyDown);
    window.removeEventListener('keyup', onGameKeyUp);
    gameOverlay.classList.remove('open');
    gameOverEl.classList.remove('open');
    gameUpgradeEl.classList.remove('open');
    gameSelectEl.classList.remove('open');
    gameAdminPanel.classList.remove('open');

  }
  function onGameKeyDown(e) {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (gamePaused) return;
    if (currentGame === 'asteroids') {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveDir = -1;
      if (e.key === 'ArrowRight' || e.key === 'd') moveDir = 1;
    } else if (currentGame === 'snake') {
      setSnakeDirection(e.key);
    }
    if (e.key === 'Escape') closeGame();
  }
  function onGameKeyUp(e) {
    if (currentGame !== 'asteroids') return;
    if ((e.key === 'ArrowLeft' || e.key === 'a') && moveDir === -1) moveDir = 0;
    if ((e.key === 'ArrowRight' || e.key === 'd') && moveDir === 1) moveDir = 0;
  }

  function togglePause() {
    // Pas de pause si aucun jeu actif, ou si un autre ecran est deja ouvert
    if (!currentGame) return;
    if (gameOverEl.classList.contains('open') || gameUpgradeEl.classList.contains('open') ||
        gameAdminPanel.classList.contains('open') || gameSelectEl.classList.contains('open')) return;

    const gamePauseEl = document.getElementById('gamePause');
    if (!gamePaused) {
      gamePaused = true;
      gameRunning = false;
      if (gameRAF) cancelAnimationFrame(gameRAF);
      gamePauseEl.classList.add('open');
    } else {
      gamePaused = false;
      gameRunning = true;
      gamePauseEl.classList.remove('open');
      gameLastTime = performance.now();
      if (currentGame === 'asteroids') {
        gameLastFireAt = performance.now();
        gameRAF = requestAnimationFrame(asteroidsLoop);
      } else if (currentGame === 'snake') {
        gameRAF = requestAnimationFrame(snakeLoop);
      }
    }
  }

  gameLeftBtn.addEventListener('pointerdown', () => moveDir = -1);
  gameRightBtn.addEventListener('pointerdown', () => moveDir = 1);
  ['pointerup', 'pointerleave'].forEach(evt => {
    gameLeftBtn.addEventListener(evt, () => { if (moveDir === -1) moveDir = 0; });
    gameRightBtn.addEventListener(evt, () => { if (moveDir === 1) moveDir = 0; });
  });
  snakeUpBtn.addEventListener('click', () => setSnakeDirection('ArrowUp'));
  snakeDownBtn.addEventListener('click', () => setSnakeDirection('ArrowDown'));
  snakeLeftBtn.addEventListener('click', () => setSnakeDirection('ArrowLeft'));
  snakeRightBtn.addEventListener('click', () => setSnakeDirection('ArrowRight'));
  function canvasPointerX(e) {
    const rect = gameCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return (clientX - rect.left) / rect.width * GW;
  }
  let dragging = false;
  gameCanvas.addEventListener('pointerdown', (e) => { if (currentGame === 'asteroids') { dragging = true; ship.x = canvasPointerX(e); } });
  gameCanvas.addEventListener('pointermove', (e) => { if (dragging && currentGame === 'asteroids') ship.x = canvasPointerX(e); });
  window.addEventListener('pointerup', () => dragging = false);
  gameCloseBtn.addEventListener('click', closeGame);
  gameQuitBtn.addEventListener('click', closeGame);
  gameRetryBtn.addEventListener('click', () => {
    if (currentGame === 'asteroids') startAsteroids();
    else if (currentGame === 'snake') startSnake();
  });

  const UPGRADE_POOL = [
    { icon: '🔥', label: 'Tir rapide', desc: 'Cadence de tir augmentée', apply: () => { ship.fireInterval = Math.max(90, ship.fireInterval - 45); } },
    { icon: '✦', label: 'Tir double', desc: 'Deux tirs simultanés', apply: () => { ship.bulletCount = Math.min(4, ship.bulletCount + 1); } },
    { icon: '🛡️', label: 'Vie supplémentaire', desc: '+1 vie (max ' + MAX_LIVES + ')', apply: () => { ship.lives = Math.min(MAX_LIVES, ship.lives + 1); updateLivesUI(); } },
    { icon: '⚡', label: 'Vitesse+', desc: 'Vaisseau plus rapide', apply: () => { ship.speed += 1.1; } },
    { icon: '🎯', label: 'Tir puissant', desc: 'Tirs plus gros, touchent plus large', apply: () => { ship.bulletPower += 0.8; } }
  ];
  function pickRandomUpgrades(n) {
    const pool = [...UPGRADE_POOL], picks = [];
    while (picks.length < n && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    return picks;
  }
  function showUpgradeChoice() {
    gameRunning = false;
    if (gameRAF) cancelAnimationFrame(gameRAF);
    const choices = pickRandomUpgrades(3);
    gameUpgradeCardsEl.innerHTML = choices.map((u, i) => `
      <button class="upgrade-card" data-idx="${i}">
        <span class="upgrade-icon">${u.icon}</span>
        <span><div class="upgrade-label">${u.label}</div><div class="upgrade-desc">${u.desc}</div></span>
      </button>

    gameUpgradeCardsEl.querySelectorAll('.upgrade-card').forEach(btn => {
      btn.addEventListener('click', () => {

        gameLastTime = performance.now();
        gameRAF = requestAnimationFrame(asteroidsLoop);
      });
    });
    gameUpgradeEl.classList.add('open');
  }
  function spawnAsteroid() {
    const r = 10 + Math.random() * 16;
    const spikes = 9 + Math.floor(Math.random() * 3);
    const vertexFactors = Array.from({ length: spikes }, () => 0.72 + Math.random() * 0.34);
    const craters = Array.from({ length: 1 + Math.floor(Math.random() * 3) }, () => ({
      angle: Math.random() * Math.PI * 2, dist: Math.random() * r * 0.5, r: r * (0.12 + Math.random() * 0.14)
    }));
    asteroids.push({
      x: r + Math.random() * (GW - r * 2), y: -r, r,
      speed: 1.2 + Math.random() * 1.3 + Math.min(elapsed / 20000, 2.5),
      spin: (Math.random() - 0.5) * 0.045, angle: Math.random() * Math.PI * 2,
      vertexFactors, craters
    });
  }
  function gameOverFn(title) {
    gameRunning = false;
    if (gameRAF) cancelAnimationFrame(gameRAF);
    gameOverTitleEl.textContent = title || 'Partie terminée';
    gameOverScoreEl.textContent = 'Score : ' + score;
    gameOverEl.classList.add('open');
  }
  function asteroidsLoop(now) {
    if (!gameRunning) return;
    const dt = Math.min(now - gameLastTime, 40);
    gameLastTime = now;
    elapsed += dt;
    ship.x += moveDir * ship.speed * (dt / 16.67);
    ship.x = Math.max(ship.w, Math.min(GW - ship.w, ship.x));
    if (now - gameLastFireAt > ship.fireInterval) {
      const n = ship.bulletCount;
      for (let i = 0; i < n; i++) {
        const offset = (i - (n - 1) / 2) * 9;
        bullets.push({ x: ship.x + offset, y: ship.y - ship.h, power: ship.bulletPower });
      }
      gameLastFireAt = now;
    }
    spawnTimer += dt;
    const spawnRate = Math.max(340, 900 - elapsed / 40);
    if (spawnTimer > spawnRate) { spawnTimer = 0; spawnAsteroid(); }
    bullets.forEach(b => b.y -= 7 * (dt / 16.67));
    bullets = bullets.filter(b => b.y > -10);
    asteroids.forEach(a => { a.y += a.speed * (dt / 16.67); a.angle += a.spin; });
    for (let ai = asteroids.length - 1; ai >= 0; ai--) {
      const a = asteroids[ai];
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        const dx = a.x - b.x, dy = a.y - b.y;
        if (Math.sqrt(dx * dx + dy * dy) < a.r + (b.power - 1) * 4) {
          asteroids.splice(ai, 1); bullets.splice(bi, 1);
          score += 10;
          gameScoreEl.textContent = 'SCORE ' + score;
          if (score >= lastUpgradeScore + 100) { lastUpgradeScore += 100; showUpgradeChoice(); return; }
          break;
        }
      }
    }
    asteroids = asteroids.filter(a => a.y - a.r < GH + 20);
    for (let ai = asteroids.length - 1; ai >= 0; ai--) {
      const a = asteroids[ai];
      const dx = a.x - ship.x, dy = a.y - ship.y;
      if (Math.sqrt(dx * dx + dy * dy) < a.r + ship.w * 0.55) {
        asteroids.splice(ai, 1);
        if (now >= ship.invincibleUntil) {
          ship.lives -= 1;
          ship.invincibleUntil = now + 1400;
          updateLivesUI();
          if (ship.lives <= 0) { gameOverFn('Vaisseau détruit'); return; }
        }
      }
    }
    drawAsteroids();
    gameRAF = requestAnimationFrame(asteroidsLoop);
  }
  function drawAsteroids() {
    const accent = themeColor('--violet'), accentPale = themeColor('--violet-pale'), bg = themeColor('--surface');
    gameCtx.fillStyle = bg;
    gameCtx.fillRect(0, 0, GW, GH);
    const isInvincible = performance.now() < ship.invincibleUntil;
    gameCtx.globalAlpha = isInvincible ? (Math.floor(performance.now() / 90) % 2 === 0 ? 1 : 0.25) : 1;
    gameCtx.fillStyle = accentPale;
    gameCtx.beginPath();
    gameCtx.moveTo(ship.x, ship.y - ship.h);
    gameCtx.lineTo(ship.x - ship.w * 0.6, ship.y + ship.h * 0.5);
    gameCtx.lineTo(ship.x + ship.w * 0.6, ship.y + ship.h * 0.5);
    gameCtx.closePath(); gameCtx.fill();
    gameCtx.globalAlpha = 1;
    gameCtx.fillStyle = accent;
    bullets.forEach(b => {
      gameCtx.beginPath();
      gameCtx.arc(b.x, b.y, 2.2 + (b.power - 1) * 1.3, 0, Math.PI * 2);
      gameCtx.fill();
    });
    asteroids.forEach(a => {
      const grad = gameCtx.createRadialGradient(a.x - a.r * 0.35, a.y - a.r * 0.35, a.r * 0.15, a.x, a.y, a.r * 1.05);
      grad.addColorStop(0, accentPale);
      grad.addColorStop(0.55, accent);
      grad.addColorStop(1, themeColor('--violet-deep'));
      gameCtx.beginPath();
      const vf = a.vertexFactors, spikes = vf.length;
      for (let i = 0; i <= spikes; i++) {
        const ang = a.angle + (i / spikes) * Math.PI * 2;
        const rad = a.r * vf[i % spikes];
        const px = a.x + Math.cos(ang) * rad, py = a.y + Math.sin(ang) * rad;
        if (i === 0) gameCtx.moveTo(px, py); else gameCtx.lineTo(px, py);
      }
      gameCtx.closePath();
      gameCtx.fillStyle = grad; gameCtx.fill();
      gameCtx.strokeStyle = themeColor('--border'); gameCtx.lineWidth = 1.2; gameCtx.stroke();
      gameCtx.fillStyle = 'rgba(0,0,0,0.22)';
      a.craters.forEach(c => {
        const cx = a.x + Math.cos(a.angle + c.angle) * c.dist, cy = a.y + Math.sin(a.angle + c.angle) * c.dist;
        gameCtx.beginPath(); gameCtx.arc(cx, cy, c.r, 0, Math.PI * 2); gameCtx.fill();
      });
      gameCtx.fillStyle = 'rgba(255,255,255,0.28)';
      gameCtx.beginPath();
      gameCtx.arc(a.x - a.r * 0.35, a.y - a.r * 0.35, a.r * 0.18, 0, Math.PI * 2);
      gameCtx.fill();
    });
  }

  // ===== Snake =====
  const SNAKE_CELL = 22;
  const SNAKE_COLS = Math.floor(GW / SNAKE_CELL);
  const SNAKE_ROWS = Math.floor(GH / SNAKE_CELL);
  let snakeBody, snakeDir, snakePendingDir, snakeFood, snakeTickInterval, snakeAcc, snakeScore;
  let snakeGodModeUntil = 0;

  function setSnakeDirection(key) {
    if (currentGame !== 'snake') return;
    const map = {
      ArrowUp: { dx: 0, dy: -1 }, ArrowDown: { dx: 0, dy: 1 },
      ArrowLeft: { dx: -1, dy: 0 }, ArrowRight: { dx: 1, dy: 0 }
    };
    const d = map[key];
    if (!d) return;
    // Empeche de faire volte-face directement sur soi-meme
    if (snakeDir && d.dx === -snakeDir.dx && d.dy === -snakeDir.dy && snakeBody.length > 1) return;
    snakePendingDir = d;
  }

  function randomFoodCell() {
    let cell;
    do {
      cell = { x: Math.floor(Math.random() * SNAKE_COLS), y: Math.floor(Math.random() * SNAKE_ROWS) };
    } while (snakeBody.some(s => s.x === cell.x && s.y === cell.y));
    return cell;
  }

  function resetSnakeState() {
    const cx = Math.floor(SNAKE_COLS / 2), cy = Math.floor(SNAKE_ROWS / 2);
    snakeBody = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    snakeDir = { dx: 1, dy: 0 };
    snakePendingDir = null;
    snakeFood = randomFoodCell();
    snakeTickInterval = 150;
    snakeAcc = 0;
    snakeScore = 0;
    score = 0;
    gameScoreEl.textContent = 'SCORE 0';
    gameOverEl.classList.remove('open');
    gameLivesEl.innerHTML = '';
  }

  function startSnake() {
    currentGame = 'snake';
    gamePaused = false;
    resetSnakeState();
    controlsSnakeEl.classList.remove('hidden-controls');
    controlsAsteroidsEl.classList.add('hidden-controls');
    updateAdminButtonVisibility();
    gameHintEl.textContent = 'Flèches ou pavé tactile pour diriger le serpent';
    gameRunning = true;
    window.addEventListener('keydown', onGameKeyDown);
    window.addEventListener('keyup', onGameKeyUp);
    gameLastTime = performance.now();
    gameRAF = requestAnimationFrame(snakeLoop);
  }

  function snakeLoop(now) {
    if (!gameRunning) return;
    const dt = Math.min(now - gameLastTime, 60);
    gameLastTime = now;
    snakeAcc += dt;

    if (snakeAcc >= snakeTickInterval) {
      snakeAcc = 0;
      if (snakePendingDir) { snakeDir = snakePendingDir; snakePendingDir = null; }

      const head = snakeBody[0];
      const newHead = { x: head.x + snakeDir.dx, y: head.y + snakeDir.dy };
      const godMode = performance.now() < snakeGodModeUntil;

      // Collision avec les murs (sauf en mode traversee)
      if (newHead.x < 0 || newHead.x >= SNAKE_COLS || newHead.y < 0 || newHead.y >= SNAKE_ROWS) {
        if (godMode) {
          newHead.x = (newHead.x + SNAKE_COLS) % SNAKE_COLS;
          newHead.y = (newHead.y + SNAKE_ROWS) % SNAKE_ROWS;
        } else {
          gameOverFn('Le serpent a heurté un mur');
          return;
        }
      }
      // Collision avec son propre corps (sauf en mode traversee)
      if (!godMode && snakeBody.some(s => s.x === newHead.x && s.y === newHead.y)) {
        gameOverFn('Le serpent s\'est mordu');
        return;
      }

      snakeBody.unshift(newHead);
      if (newHead.x === snakeFood.x && newHead.y === snakeFood.y) {
        score += 10;
        gameScoreEl.textContent = 'SCORE ' + score;
        snakeFood = randomFoodCell();
        snakeTickInterval = Math.max(70, snakeTickInterval - 3);
      } else {
        snakeBody.pop();
      }
    }

    drawSnake();
    gameRAF = requestAnimationFrame(snakeLoop);
  }

  function drawSnake() {
    const accent = themeColor('--violet'), accentPale = themeColor('--violet-pale'), bg = themeColor('--surface');
    gameCtx.fillStyle = bg;
    gameCtx.fillRect(0, 0, GW, GH);

    // Nourriture
    gameCtx.fillStyle = accentPale;
    gameCtx.beginPath();
    gameCtx.arc(
      snakeFood.x * SNAKE_CELL + SNAKE_CELL / 2,
      snakeFood.y * SNAKE_CELL + SNAKE_CELL / 2,
      SNAKE_CELL * 0.32, 0, Math.PI * 2
    );
    gameCtx.fill();

    // Corps du serpent - degrade de la tete (claire) a la queue (foncee)
    snakeBody.forEach((seg, i) => {
      const t = i / Math.max(1, snakeBody.length - 1);
      gameCtx.fillStyle = i === 0 ? accentPale : accent;
      gameCtx.globalAlpha = i === 0 ? 1 : Math.max(0.4, 1 - t * 0.6);
      const pad = i === 0 ? 1 : 2;
      gameCtx.beginPath();
      gameCtx.roundRect(
        seg.x * SNAKE_CELL + pad, seg.y * SNAKE_CELL + pad,
        SNAKE_CELL - pad * 2, SNAKE_CELL - pad * 2, 6
      );
      gameCtx.fill();
    });
    gameCtx.globalAlpha = 1;
  }

  // ===== Init =====
  renderMessages();
  renderHistoryMenu();
})();
</script>
